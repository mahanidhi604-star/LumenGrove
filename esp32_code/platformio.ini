; PlatformIO Project Configuration File for LumenGrove Solar Power Bank Kiosk
; Target: ESP32 NodeMCU / ESP32 DevKit (ESP32-WROOM-32)
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    miguelbalboa/MFRC522 @ ^1.4.11
