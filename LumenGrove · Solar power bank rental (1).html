<!DOCTYPE html>
<html lang="en" data-t="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LumenGrove · Solar power bank rental</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
:root,[data-t=cream]{--bg:#f4efe2;--fg:#23301f;--mut:#5d6652;--card:#fffaf0;--ac:#e8a020;--ac2:#4a6b2f;--on:#23301f;--ln:#d9d0b8}
[data-t=forest]{--bg:#17231d;--fg:#eef2e6;--mut:#aab8a6;--card:#20302a;--ac:#f5b73b;--ac2:#8fbf6a;--on:#17231d;--ln:#35493f}
[data-t=blueprint]{--bg:#0e2238;--fg:#e3f1fb;--mut:#94b4cc;--card:#14304d;--ac:#4fd3f0;--ac2:#9fe0ff;--on:#0e2238;--ln:#27506f}
[data-t=dusk]{--bg:#f1dfcf;--fg:#3a2218;--mut:#7a5a48;--card:#fbefe3;--ac:#c4562b;--ac2:#8a3b1c;--on:#fff4ea;--ln:#dcc0a8}
[data-t=volt]{--bg:#0b0b0c;--fg:#f5f5f0;--mut:#a8a8a0;--card:#17171a;--ac:#e6ff2e;--ac2:#fff;--on:#0b0b0c;--ln:#2c2c30}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 Outfit,'Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .4s,color .4s}
h1,h2,h3{font-weight:200;line-height:1.1;margin:0 0 .5em;outline:0}h1{font-size:clamp(2.4rem,8vw,5.5rem);letter-spacing:-.02em}h2{font-size:clamp(1.6rem,4vw,2.6rem)}h3{font-weight:600;font-size:1.1rem}
.k,.num{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.num{font-size:2.4rem;letter-spacing:0;line-height:1}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 96px}p{max-width:60ch;color:var(--mut)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--fg);text-decoration:none;font-size:1.15rem}
nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}nav a{padding:10px 14px;border-radius:99px;color:var(--fg);text-decoration:none;white-space:nowrap;min-height:44px;display:flex;align-items:center;transition:background .2s}nav a:hover,nav a.on{background:var(--ln)}
select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-height:44px;max-width:100%}
label{display:block;font-weight:600;margin:14px 0 4px}.err{color:#b3261e;font-size:.9rem;min-height:1.2em}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:99px;border:0;background:var(--ac);color:var(--on);font:600 1rem Outfit,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn.g{background:transparent;border:1px solid var(--fg);color:var(--fg)}
.plug{animation:glow 3s ease-in-out infinite;box-shadow:0 0 0 0 var(--ac)}@keyframes glow{50%{box-shadow:0 0 0 8px transparent}0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 60%,transparent)}}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hero{display:grid;gap:24px;grid-template-columns:1.4fr 1fr;align-items:center;min-height:70vh}.g3{width:100%;aspect-ratio:1;max-width:480px;justify-self:center;filter:drop-shadow(0 30px 40px color-mix(in srgb,var(--ac) 25%,transparent))}.g3 canvas{width:100%!important;height:100%!important;display:block}.hero h1{background:linear-gradient(100deg,var(--fg) 40%,var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.on{opacity:1;transform:none}
.sun{position:absolute;right:-60px;top:80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 68%);opacity:.35;animation:spin 40s linear infinite;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}
.ring{stroke-dasharray:503;stroke-dashoffset:503;animation:fill 2.2s .3s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fill{to{stroke-dashoffset:0}}
.bolt{animation:flash 1.4s .2s 1}@keyframes flash{40%{filter:drop-shadow(0 0 6px var(--ac))}}
#v.in{animation:pin .32s cubic-bezier(.2,.8,.2,1)}#v.out{opacity:0;transform:translateY(-6px);transition:.16s ease-in}@keyframes pin{from{opacity:0;transform:translateY(14px)}}
.hub{animation:rev .7s cubic-bezier(.2,.8,.2,1)}@keyframes rev{from{clip-path:circle(0 at 85% 0)}to{clip-path:circle(150% at 85% 0)}}
.tile{display:flex;flex-direction:column;gap:6px;color:var(--fg);text-decoration:none;min-height:120px;transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-4px);border-color:var(--ac)}.tile .k{color:var(--ac2)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.slot{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:10px;text-align:left;color:var(--fg);font:inherit;min-height:64px;cursor:pointer}.slot.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.slot:disabled{opacity:.55;cursor:not-allowed}
.bar{height:6px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac2);transition:width .6s}
.badge{display:inline-flex;gap:6px;align-items:center;padding:4px 12px;border-radius:99px;background:var(--ln);font-size:.85rem}.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ac);animation:glow 2s infinite}
.sk{background:linear-gradient(90deg,var(--ln),var(--card),var(--ln));background-size:200%;animation:sh 1.2s infinite;border-radius:10px;height:20px}@keyframes sh{to{background-position:-200%}}
details{border-bottom:1px solid var(--ln);padding:12px 0}summary{cursor:pointer;font-weight:600;min-height:44px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}.heat b{aspect-ratio:1;border-radius:6px;background:var(--ac);display:grid;place-items:center;font-size:.7rem;color:var(--on)}
.tab{display:none}#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}#toast.on{opacity:1}
footer{padding:24px 20px;border-top:1px solid var(--ln);color:var(--mut);font-size:.9rem;text-align:center}footer a{color:var(--mut)}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.flow span{padding:8px 14px;border:1px dashed var(--ac2);border-radius:12px}.flow i{color:var(--ac2);font-style:normal}
@media(max-width:720px){.hero{grid-template-columns:1fr}.ap nav{display:none}.ap .tab{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));justify-content:space-around}.tab a{flex:1;text-align:center;padding:10px 2px;min-height:44px;color:var(--fg);text-decoration:none;font-size:.8rem;border-radius:12px}.tab a.on{background:var(--ln)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ring{stroke-dashoffset:0}}
html.rm *{animation:none!important;transition:none!important}html.rm .ring{stroke-dashoffset:0}
[data-t=omni]{--bg:#030304;--fg:#fff;--mut:#94a3b8;--card:#0f1115;--ac:#f7931a;--ac2:#ffd600;--on:#000;--ln:#262a33}
#ld{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}#ld.x{opacity:0;pointer-events:none}#ld svg{animation:pop 1.2s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}
#cu{position:fixed;inset:0;z-index:50;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr)}#cu i{background:var(--ac);transform-origin:bottom;transform:scaleY(0);transition:transform .42s cubic-bezier(.7,0,.2,1)}#cu.on i{transform-origin:top;transform:scaleY(1)}#cu i:nth-child(2){transition-delay:.05s}#cu i:nth-child(3){transition-delay:.1s}#cu i:nth-child(4){transition-delay:.15s}
#cg{position:fixed;left:0;top:0;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 28%,transparent),transparent 65%);pointer-events:none;z-index:1}.tr{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--ac);pointer-events:none;z-index:70}
.pick{text-align:left}.pick.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.kd{height:60px;border-radius:12px;border:1px solid var(--ln);display:grid;place-items:center;font:700 .8rem 'Barlow Condensed';color:var(--mut);transform-origin:top;transition:transform .9s cubic-bezier(.2,.8,.2,1),box-shadow .6s}.kd.lit{transform:perspective(300px) rotateX(-65deg);background:var(--ac);color:var(--on);box-shadow:0 0 30px var(--ac)}
.rt{stroke-dasharray:6 5;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}.pl{animation:pls 2s infinite;transform-box:fill-box;transform-origin:center}@keyframes pls{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
#lm{position:fixed;right:16px;bottom:16px;z-index:8}#lmp{position:fixed;right:16px;bottom:76px;width:min(340px,calc(100% - 32px));z-index:8;display:none}#lmm{height:220px;overflow:auto;font-size:14px}.m{margin:6px 0;padding:8px 12px;border-radius:12px;background:var(--ln)}.m.u{background:color-mix(in srgb,var(--ac) 25%,transparent);text-align:right}
@media(max-width:720px){#lm{bottom:84px}#lmp{bottom:144px}}
</style>
</head>
<body>
<div id="hd"></div><main id="v"></main><footer>LumenGrove · demo prototype · pricing and team details to be added · <a href="#admin-login">Staff</a></footer>
<div id="tb" class="tab"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),q=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const L={en:{home:'Home',how:'How it works',tech:'Technology',impact:'Impact',about:'About',plug:'Plug In',find:'Find a bank',rent:'Rent',rentals:'My rentals',me:'Settings',hub:'Hub',si:'Sign in',guest:'Continue as guest',h1:'No more battery anxiety.',sub:'Solar-charged power banks, ready at stations around campus.',greet:'Where are you charging today?',back:'← LumenGrove'},
kn:{home:'ಮುಖಪುಟ',how:'ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ',tech:'ತಂತ್ರಜ್ಞಾನ',impact:'ಪರಿಣಾಮ',about:'ಬಗ್ಗೆ',plug:'ಪ್ಲಗ್ ಇನ್',find:'ಬ್ಯಾಂಕ್ ಹುಡುಕಿ',rent:'ಬಾಡಿಗೆ',rentals:'ನನ್ನ ಬಾಡಿಗೆಗಳು',me:'ಸೆಟ್ಟಿಂಗ್ಸ್',hub:'ಹಬ್',si:'ಸೈನ್ ಇನ್',guest:'ಅತಿಥಿಯಾಗಿ ಮುಂದುವರಿಯಿರಿ',h1:'ಇನ್ನು ಬ್ಯಾಟರಿ ಚಿಂತೆ ಬೇಡ.',sub:'ಕ್ಯಾಂಪಸ್‌ನ ಕೇಂದ್ರಗಳಲ್ಲಿ ಸೌರ ಚಾರ್ಜ್ ಆದ ಪವರ್ ಬ್ಯಾಂಕ್‌ಗಳು ಸಿದ್ಧ.',greet:'ಇಂದು ಎಲ್ಲಿ ಚಾರ್ಜ್ ಮಾಡುತ್ತೀರಿ?',back:'← ಲೂಮೆನ್‌ಗ್ರೋವ್'},
hi:{home:'होम',how:'यह कैसे काम करता है',tech:'तकनीक',impact:'प्रभाव',about:'परिचय',plug:'प्लग इन',find:'बैंक खोजें',rent:'किराया',rentals:'मेरे किराये',me:'सेटिंग्स',hub:'हब',si:'साइन इन',guest:'अतिथि के रूप में जारी रखें',h1:'अब बैटरी की चिंता नहीं।',sub:'कैंपस के स्टेशनों पर सौर ऊर्जा से चार्ज पावर बैंक तैयार हैं।',greet:'आज कहाँ चार्ज करेंगे?',back:'← लूमेनग्रोव'}};
const S={l:q('l','en'),th:q('th',matchMedia('(prefers-color-scheme:dark)').matches?'forest':'cream'),u:null,rt:{step:1,st:'library',slot:null,t0:0,res:0}};
const t=k=>(L[S.l]||{})[k]||L.en[k]||k;
const ST=[['library','Library',120,90],['mm','M.M Foods',330,70],['mingoes','Big Mingoes',250,200],['cauvery','Cauvery Hostel',80,230]].map((a,i)=>({id:a[0],n:a[1],x:a[2],y:a[3],lat:null,lng:null,slots:8,free:3+i,stock:{std:3,lap:2,fast:1+i%2,wl:2},solar:200+i*40,batt:70+i*5,temp:34,ok:true}));
const PR={rate:'',grace:10,cap:'',late:'',dep:''};
const slots=id=>[...Array(10)].map((_,i)=>{const c=(i*37+id.length*13)%100,r=i%7==3;return{i,c,s:r?'out':c>=90?'ready':'charging'}});
const free=id=>{const s=ST.find(x=>x.id==id);return s?s.free:0};
const logo=(s=34)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3c11 6 16 15 16 26a16 16 0 0 1-32 0C8 18 13 9 24 3z" fill="var(--ac2)"/><path class="bolt" d="M27 13 17 28h6l-2 9 11-16h-7z" fill="var(--ac)"/><circle cx="24" cy="42" r="1.8" fill="var(--ac)"/></svg>`;
const qr=id=>{let r='',h=[...id].reduce((a,c)=>a*31+c.charCodeAt(0),7);for(let y=0;y<9;y++)for(let x=0;x<9;x++){h=(h*1103515245+12345)&0x7fffffff;if(h%3)r+=`<rect x="${x*8}" y="${y*8}" width="7" height="7" fill="currentColor"/>`}return`<svg viewBox="0 0 72 72" width="96" role="img" aria-label="QR placeholder for ${id}">${r}</svg>`};
const sol=()=>`<span class="badge sol">Solar now · 38 W</span>`;
const need=`<section class="wrap"><h1 tabindex="-1">${'Sign in to rent'}</h1><p>Guests can browse stations. Renting needs a student account.</p><a class="btn" href="#signin">Sign in</a></section>`;
const stn=s=>`<a class="card tile" href="#app-station-${s.id}"><span class="k">${free(s.id)}/10 free</span><h3>${s.n}</h3>${sol()}</a>`;
const PG={
home:()=>`<div class="wrap" style="position:relative"><div class="sun"></div><div class="hero"><div><span class="k">LumenGrove · campus power</span><h1 tabindex="-1">${t('h1')}</h1><p>${t('sub')}</p><p><a class="btn plug" href="#plug">${t('plug')} ⚡</a> <a class="btn g" href="#how">${t('how')}</a></p></div><div class="g3" role="img" aria-label="Interactive 3D power bank"><canvas id="cv"></canvas></div></div>
<h2>Three steps</h2><div class="grid"><div class="card"><span class="num">01</span><h3>Find</h3><p>Pick a station with free, fully charged banks.</p></div><div class="card"><span class="num">02</span><h3>Unlock</h3><p>Reserve, pay and the lock opens from your phone.</p></div><div class="card"><span class="num">03</span><h3>Return</h3><p>Drop it at any station. Return is checked automatically.</p></div></div>
<h2 style="margin-top:48px">Live stations</h2><div class="grid">${ST.map(stn).join('')}</div></div>`,
how:()=>`<div class="wrap"><h1 tabindex="-1">${t('how')}</h1><h3>Power path</h3><div class="flow"><span>Solar panel</span><i>→</i><span>Charge controller</span><i>→</i><span>Station battery</span><i>→</i><span>5 V slot chargers</span></div><h3 style="margin-top:32px">Control path</h3><div class="flow"><span>Mobile app</span><i>→</i><span>ESP32 allocates a slot</span><i>→</i><span>Solenoid lock</span><i>→</i><span>Return check: RFID · 5 V · switch</span></div></div>`,
tech:()=>`<div class="wrap"><h1 tabindex="-1">${t('tech')}</h1><div class="grid"><div class="card"><h3>Hardware</h3><p>ESP32, RFID RC522, INA219 sensors, SW-420 vibration sensor, solenoid locks, solar panel with charge controller.</p></div><div class="card"><h3>Solar-aware slot allocation</h3><p>The station hands out the best-charged bank, based on current solar yield.</p></div><div class="card"><h3>Multi-factor return check</h3><p>RFID, 5 V current draw and a limit switch must all agree.</p></div></div></div>`,
impact:()=>`<div class="wrap"><h1 tabindex="-1">${t('impact')}</h1><div class="grid"><div class="card"><div class="num">1,284</div><p>kWh solar used (demo data)</p></div><div class="card"><div class="num">1,053 kg</div><p>CO₂ avoided (demo data)</p></div><div class="card"><div class="num">SDG 7 · 12</div><p>Clean energy and responsible consumption.</p></div></div></div>`,
about:()=>`<div class="wrap"><h1 tabindex="-1">${t('about')}</h1><p>LumenGrove is an IoT, solar-powered power bank rental network for campus. Phase 1 plans the idea, Phase 2 builds the hardware, Phase 3 tests and presents.</p><h2>FAQ</h2><details><summary>Is it safe?</summary><p>Banks are charged within safe limits and locked in station slots.</p></details><details><summary>What if a bank is stolen?</summary><p>Locks, RFID and vibration sensing flag unauthorised removal.</p></details><details><summary>Something is not charging</summary><p>Use “Report a problem” in Plug In.</p></details></div>`,
plug:()=>`<div class="wrap hub"><span class="k">LumenGrove hub</span><h1 tabindex="-1">${t('greet')}</h1><div class="grid">${[['app-stations',t('find'),'Stations and free banks'],['app-rent',t('rent'),'Reserve, pay, unlock'],['app-rentals',t('rentals'),'Active rental and history'],['app-report','Report a problem','Lock stuck? Not charging?'],['app-impact','My impact','kWh and CO₂'],['app-settings',t('me'),'Language, theme, motion'],['signin',t('si'),'Or continue as guest']].map(a=>`<a class="card tile" href="#${a[0]}"><span class="k">${a[1]}</span><p>${a[2]}</p></a>`).join('')}</div></div>`,
signin:()=>`<div class="wrap" style="max-width:520px"><h1 tabindex="-1">${t('si')}</h1><label for="em">Email</label><input id="em" type="email" style="width:100%"><div class="err" id="e1"></div><label for="pw">Password</label><input id="pw" type="password" style="width:100%"><div class="err" id="e2"></div><p><button class="btn" onclick="sIn()">${t('si')}</button> <button class="btn g" onclick="login('guest')">${t('guest')}</button></p><p class="badge">Demo only</p><p><button class="btn g" onclick="login('student')">Demo student</button></p></div>`,
'admin-login':()=>`<div class="wrap" style="max-width:520px"><span class="k">Staff only</span><h1 tabindex="-1">Admin sign in</h1><p>Demo accounts, replaced by Supabase later.</p><p><button class="btn" onclick="login('super')">Super admin</button> <button class="btn g" onclick="login('tech')">Technician</button></p></div>`,
'app-stations':()=>`<div class="wrap"><h1 tabindex="-1">${t('find')}</h1><svg viewBox="0 0 300 220" style="width:100%;max-width:520px" role="img" aria-label="Campus map"><rect width="300" height="220" rx="20" fill="var(--card)" stroke="var(--ln)"/>${ST.map(s=>`<a href="#app-station-${s.id}"><circle cx="${s.x}" cy="${s.y}" r="14" fill="var(--ac)"/><text x="${s.x}" y="${s.y+30}" text-anchor="middle" font-size="11" fill="var(--fg)">${s.n}</text></a>`).join('')}</svg><div class="grid" style="margin-top:20px">${ST.map(stn).join('')}</div></div>`,

window.login=r=>{S.u=r=='student'?{role:'student',name:'Demo Student',email:'demo@rvce.edu.in',phone:'+910000000000'}:{role:r,name:r=='super'?'Super admin':r=='tech'?'Technician':'Guest'};location.hash=r=='super'||r=='tech'?'admin':'plug'};
const st0=PG['app-settings'];PG['app-settings']=()=>st0().replace('</div>','<p><button class="btn g" onclick="S.u=null;sv(\'lg_user\',\'\');toast(\'Signed out\')">Sign out</button></p></div>');
const cards=()=>`<div class="grid">${ST.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between"><h3>${s.n}</h3><span class="badge">${s.ok?'online':'offline'}</span></div><p>Slots free <b>${s.free}/${s.slots}</b> · Solar <b>${s.solar|0} W</b> · Panel temp <b>${s.temp.toFixed(1)}°C</b></p><div class="bar"><i style="width:${s.batt}%"></i></div><small>Battery reserve ${s.batt|0}% · ${Object.keys(CATS).map(k=>CATS[k].n.replace('Grove ','')+' '+s.stock[k]).join(' · ')}</small><p><button class="btn g" onclick="tg('${s.id}')">Toggle status</button></p></div>`).join('')}</div>`;
const adm0=admin;admin=function(){return adm0().replace('<h2 style="margin-top:32px">Busy hours</h2>','<h2 style="margin-top:32px">Station command</h2><div id="adm">'+cards()+'</div><h2 style="margin-top:32px">Busy hours</h2>')};
let tk=0;setInterval(()=>{tk++;ST.forEach(s=>{s.solar=Math.max(80,s.solar+Math.random()*30-15);s.batt=Math.min(100,Math.max(20,s.batt+Math.random()*2-1));s.temp=Math.min(55,Math.max(28,s.temp+Math.random()-.5))});const r=S.rent;if(r&&r.started){r.batt=100-el()/3600*CATS[r.cat].dr*300;const T=$('#tm');if(T){T.textContent=fmt(r.dur-el());$('#bt').textContent=Math.max(0,r.batt)|0+'%';$('#bt').textContent=(Math.max(0,r.batt)|0)+'%';$('#bb').style.width=Math.max(0,r.batt)+'%'}if(!r.done&&el()>=r.dur){r.done=true;const b=best(true);toast("Time's up! Return your power bank to "+b.n+' ('+dist(b)+' m away).')}}if(tk%2==0&&location.hash=='#admin'&&$('#adm')&&!/INPUT|SELECT/.test(document.activeElement.tagName))$('#adm').innerHTML=cards()},1000);
const KB=[[/pin/,'Your 6-digit PIN is under My rentals. Enter it at the station kiosk and your slot will unlock.'],[/return|late|time/,'When time ends you get an alert with the best station to return to.'],[/charge|battery|%/,'Charge percentage is shown live on the My rentals page.'],[/wireless|magnet/,'Grove Wireless is a magnetic pad charger for compatible phones.'],[/fast|laptop/,'Grove Fast charges a laptop and phone together; Grove Laptop suits laptops only.'],[/login|email|sign/,'Sign in with your rvce.edu.in email.'],[/hour|duration|long/,'Rentals run from 30 minutes to 6 hours.']];
document.body.insertAdjacentHTML('beforeend','<div id="cu"><i></i><i></i><i></i><i></i></div><div id="lmp" class="card"><b class="k">Lumi · help</b><div id="lmm"></div><input id="lmi" aria-label="Message Lumi" placeholder="Ask about PINs, returns, charging…" style="width:100%"></div><button id="lm" class="btn" aria-label="Open Lumi help chat">Lumi</button>');
window.cu=on=>$('#cu').classList.toggle('on',on);
const say=(x,u)=>{$('#lmm').insertAdjacentHTML('beforeend',`<div class="m${u?' u':''}"></div>`);$('#lmm').lastChild.textContent=x;$('#lmm').scrollTop=1e5};
$('#lm').onclick=()=>{const c=$('#lmp');c.style.display=c.style.display=='block'?'none':'block';if(!$('#lmm').children.length)say('Hi, I am Lumi. Ask me about PINs, bank types, returns or charging.')};
$('#lmi').onkeydown=e=>{if(e.key!=='Enter'||!e.target.value.trim())return;const x=e.target.value;e.target.value='';say(x,1);const h=KB.find(k=>k[0].test(x.toLowerCase()));setTimeout(()=>say(h?h[1]:'I am not sure. Please contact management using your registered phone or email.'),400)};
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const l=document.createElement('div');l.id='ld';l.innerHTML=logo(96);document.body.append(l);setTimeout(()=>l.classList.add('x'),1300);setTimeout(()=>l.remove(),1900);
if(matchMedia('(pointer:fine)').matches){document.body.insertAdjacentHTML('beforeend','<div id="cg"></div>'+'<i class="tr"></i>'.repeat(8));const g=$('#cg'),tr=[...document.querySelectorAll('.tr')],P=tr.map(()=>[0,0]);let mx=-300,my=-300,gx=-300,gy=-300;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});(function f(){gx+=(mx-gx)*.12;gy+=(my-gy)*.12;g.style.transform=`translate(${gx}px,${gy}px)`;let px=mx,py=my;tr.forEach((d,i)=>{P[i][0]+=(px-P[i][0])*.35;P[i][1]+=(py-P[i][1])*.35;px=P[i][0];py=P[i][1];d.style.transform=`translate(${px}px,${py}px) scale(${1-i/9})`;d.style.opacity=.6-i*.07});requestAnimationFrame(f)})()}}
document.documentElement.dataset.t=S.th;addEventListener('hashchange',()=>go());go(1);
</script>
</body>
